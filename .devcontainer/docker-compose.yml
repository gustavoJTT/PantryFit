services:
  dev:
    image: mcr.microsoft.com/devcontainers/java:1-21-bookworm
    command: sleep infinity
    volumes:
      - ..:/workspaces:cached
      - /var/run/docker.sock:/var/run/docker.sock

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: pantryfit
      POSTGRES_PASSWORD: pantryfit
      POSTGRES_DB: pantryfit
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
