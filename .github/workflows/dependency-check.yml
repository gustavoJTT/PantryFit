name: Dependency Check

on:
  pull_request:
  push:

jobs:
  dependency-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Cache OWASP NVD data
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: dependency-check-nvd-13.0.0-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            dependency-check-nvd-13.0.0-

      - name: OWASP Dependency-Check
        run: |
          attempts=3
          for attempt in $(seq 1 "$attempts"); do
            if ./mvnw --batch-mode --no-transfer-progress org.owasp:dependency-check-maven:check; then
              exit 0
            fi

            if [ "$attempt" -lt "$attempts" ]; then
              delay=$((attempt * 30))
              echo "Dependency-Check failed on attempt $attempt/$attempts; retrying in ${delay}s."
              sleep "$delay"
            fi
          done

          echo "Dependency-Check failed after $attempts attempts."
          exit 1
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

      - name: Upload dependency-check reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-check-reports
          path: target/dependency-check-report.*
          if-no-files-found: ignore
