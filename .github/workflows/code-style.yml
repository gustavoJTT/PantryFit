name: Code Style

on:
  pull_request:
  push:

jobs:
  checkstyle:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Check Java coding style
        run: ./mvnw --batch-mode --no-transfer-progress checkstyle:check
